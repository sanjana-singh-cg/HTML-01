<!DOCTYPE html>
<html>
<head>
    <title>Superhero Score</title>

    <style>
        body {
            margin: 0;
            background-color: black;
        }

        .page {
            background-color: white;
            margin: 47px;
            height: 690px;
        }

        .game {
            display: flex;
            justify-content: center;
            gap: 110px;
            padding-top: 6px;
        }

        .team {
            display: flex;
            gap: 18px;
        }

        .card {
            width: 135px;
            height: 230px;
            border: 1px solid lightgray;
            border-radius: 7px;
            box-shadow: 0px 0px 3px gray;
            text-align: center;
            padding: 15px 10px;
            box-sizing: border-box;
        }

        .card img {
            width: 100px;
            height: 100px;
        }

        .name {
            font-size: 16px;
            margin: 5px 0;
        }

        .score {
            font-size: 45px;
            margin: 5px 0;
        }

        .result {
            font-size: 48px;
            margin: 0;
        }
    </style>
</head>

<body>

    <div class="page">

        <div class="game">

            <div class="team">

                <div class="card">
                    <img src="assets/super-1.png" alt="Spiderman">

                    <p class="name">Spiderman</p>

                    <p class="score">12</p>
                </div>

                <div class="card">
                    <img src="assets/super-2.png" alt="Wonder Woman">

                    <p class="name">Wonder<br>Women</p>

                    <p class="score">30</p>
                </div>

            </div>

            <p class="result">5 - 0</p>

            <div class="team">

                <div class="card">
                    <img src="assets/super-3.png" alt="Captain America">

                    <p class="name">Captain<br>America</p>

                    <p class="score">50</p>
                </div>

                <div class="card">
                    <img src="assets/super-4.png" alt="Gem Woman">

                    <p class="name">Gem Woman</p>

                    <p class="score">12</p>
                </div>

            </div>

        </div>

    </div>

</body>
</html>
